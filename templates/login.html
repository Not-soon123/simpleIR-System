<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IR System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container" style="max-width: 560px; margin-top: 80px;">
        <div class="header" style="border-radius: 24px; padding: 32px 24px 22px; margin-bottom: 24px;">
            <div class="header-content">
                <h1 style="font-size: 2rem;">IR System Login</h1>
                <p class="subtitle" style="margin-top: 8px; color: rgba(255,255,255,0.9);">Sign in as admin to add documents, or as guest to search.</p>
            </div>
        </div>
        <div class="search-container">
            {% if error %}
                <div class="query-info" style="margin-bottom: 16px; color: var(--danger-color); font-weight: 600;">
                    {{ error }}
                </div>
            {% endif %}
            <form method="POST">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="admin or guest" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password for admin access">
                </div>
                <div class="form-actions" style="display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:24px;">
                    <button type="submit" class="btn-primary">Login</button>
                    <a href="{{ url_for('login') }}" class="btn-secondary" style="text-decoration:none; padding:10px 16px; display:inline-flex; align-items:center; justify-content:center;">Reset</a>
                </div>
            </form>
            {% if help_text %}
                <p style="margin-top:20px; color: var(--text-secondary); font-size:0.95rem;">{{ help_text }}</p>
            {% endif %}
        </div>
    </div>
</body>
</html>
